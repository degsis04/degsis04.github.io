name: MIRCA-OS v2 public source discovery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirca-source-discovery.yml'
      - 'research/basin-data-audit/scripts/mirca_source_discover.py'
permissions:
  contents: write
jobs:
  identify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - run: python research/basin-data-audit/scripts/mirca_source_discover.py
      - name: Preserve discovery and error reporting
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/mirca_os/
          git diff --cached --quiet || (git commit -m 'data: source inventory of MIRCA-OS v2' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirca-source-discovery
          path: research/basin-data-audit/results/mirca_os/
