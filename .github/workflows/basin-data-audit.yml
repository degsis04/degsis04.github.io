name: Official TFDD and GDHY source audit
on:
  push:
    paths:
      - '.github/workflows/basin-data-audit.yml'
      - 'research/basin-data-audit/scripts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'pyshp>=2.3,<3' 'netCDF4>=1.6,<2'
      - name: Download source archives and inspect layers
        run: python research/basin-data-audit/scripts/discover.py
      - name: Commit manifest and errors (if any)
        if: always()
        run: |
          if [ ! -d research/basin-data-audit/results ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results
          git diff --cached --quiet || (git commit -m 'audit: provenance of source downloads' && git push)
