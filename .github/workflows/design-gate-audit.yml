name: Re-audit design eligibility and institutional evidence gates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/design-gate-audit.yml'
      - 'research/basin-data-audit/scripts/design_gate_audit.py'
permissions:
  contents: write
jobs:
  strict-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3'
      - name: Recompute independent crop-season and institute gates
        run: python research/basin-data-audit/scripts/design_gate_audit.py
      - name: Commit machine-readable audit and exceptions
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/design_gate_v1/
          git diff --cached --quiet || (git commit -m 'data QA: recomputed strict research eligibility and blocking gates' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-design-eligibility-qa
          path: research/basin-data-audit/results/design_gate_v1/
