name: MIRCA-OS v2 crop maps x HarvestStat district exposure
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirca-district-exposure.yml'
      - 'research/basin-data-audit/scripts/mirca_district_exposure.py'
permissions:
  contents: write
jobs:
  district-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get -qq update && sudo apt-get install -y -qq p7zip-full
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'geopandas>=1.0,<2' 'rasterio>=1.3,<2' 'pyogrio>=0.9' 'shapely>=2' 'pyproj>=3' 'requests>=2.31,<3'
      - run: python research/basin-data-audit/scripts/mirca_district_exposure.py
      - name: Preserve computed tables or error log
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/mirca_os/district_exposure/
          git diff --cached --quiet || (git commit -m 'data: MIRCA-OS crop irrigation exposure for HarvestStat admin units' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirca-harveststat-district-exposure
          path: research/basin-data-audit/results/mirca_os/district_exposure/
