name: MIRCA-OS v2 crop-specific irrigation maps for 3 basins
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirca-crop-maps.yml'
      - 'research/basin-data-audit/scripts/mirca_crop_maps.py'
permissions:
  contents: write
jobs:
  crop-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get -qq update && sudo apt-get install -y -qq p7zip-full
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'geopandas>=1.0,<2' 'rasterio>=1.3,<2' 'pyogrio>=0.9' 'shapely>=2' 'pyproj>=3' 'requests>=2.31,<3' 'matplotlib>=3.7,<4'
      - name: Compute source-verified annual crop maps and area shares
        run: python research/basin-data-audit/scripts/mirca_crop_maps.py
      - name: Save numerical tables and plotted maps (including explicit failure provenance)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/mirca_os/crop_maps/
          git diff --cached --quiet || (git commit -m 'data: MIRCA-OS v2 2000–2020 observed source map summaries and QA' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirca-v2-maize-rice-sorghum-maps
          path: research/basin-data-audit/results/mirca_os/crop_maps/
