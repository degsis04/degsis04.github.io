name: Malawi original FDW historical district names and FNID comparison
on:
  push:
    paths:
      - '.github/workflows/malawi-fdw-historical-district-name-check.yml'
      - 'research/basin-data-audit/scripts/malawi_fdw_historical_district_names_v2.py'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/malawi-fdw-historical-district-name-check.yml'
      - 'research/basin-data-audit/scripts/malawi_fdw_historical_district_names_v2.py'
permissions:
  contents: write
jobs:
  historical-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Verify origin FDW by SHA and compare historical district labels
        run: python research/basin-data-audit/scripts/malawi_fdw_historical_district_names_v2.py
      - name: Preserve all provenance and blockers
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/malawi_apes_fdw_source_audit_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'science audit: historical districts APES FDW to HarvestStat with FNID warnings'
            for retry in 1 2 3; do
              git pull --rebase && git push && break || sleep 4
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Malawi-historical-APES-FDW-FNID-audit
          path: research/basin-data-audit/results/malawi_apes_fdw_source_audit_v1/
