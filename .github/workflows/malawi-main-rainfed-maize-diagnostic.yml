name: Diagnostic Malawi Main Rainfed maize weather-to-yield fixed effects
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/malawi-main-rainfed-maize-diagnostic.yml'
      - 'research/basin-data-audit/scripts/malawi_main_rainfed_maize_exploratory_FE_v1.py'
permissions:
  contents: write
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric and statistical packages
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scipy>=1.12,<2' 'statsmodels>=0.14,<1'
      - name: Prespecified 16- and 23-district fixed-effect diagnostics and tests
        run: python research/basin-data-audit/scripts/malawi_main_rainfed_maize_exploratory_FE_v1.py
      - name: Save outputs and error diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/malawi_rainfed_weather_yield_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'research: rainfed Malawi maize exploratory weather yield association with FE and sensitivity'
            for attempt in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: malawi-main-rainfed-maize-weather-yield-diagnostics
          path: research/basin-data-audit/results/malawi_rainfed_weather_yield_v1/
