name: Field phenology disagreement flags for provisional crop-outcome climate join
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/waha-outcome-risk-flags.yml'
      - 'research/basin-data-audit/scripts/waha_outcome_climate_risk_flags_v1.py'
permissions:
  contents: write
jobs:
  risk-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3'
      - name: Transfer only independently supported regional validation flags
        run: python research/basin-data-audit/scripts/waha_outcome_climate_risk_flags_v1.py
      - name: Keep risk stratification output and source QA
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/field_phenology_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'QA: Waha field survey month agreement risks for provisional yield panel'
            for retry in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
