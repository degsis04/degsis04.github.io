name: Waha African Crop Calendar original-source privacy-safe audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/waha-field-phenology-v1.yml'
      - 'research/basin-data-audit/scripts/waha_field_phenology_source_audit_v1.py'
permissions:
  contents: write
jobs:
  source-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Download pinned original LSMS crop-season data and publish aggregated counts only
        run: python research/basin-data-audit/scripts/waha_field_phenology_source_audit_v1.py
      - name: Preserve successful or failed source provenance and privacy-safe aggregates
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/field_phenology_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'data: original Waha field reported crop calendars aggregate source QA'
            for retry in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-phenology-aggregates-no-person-level-data
          path: research/basin-data-audit/results/field_phenology_v1/
