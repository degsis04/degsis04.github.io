name: Conservative JRC phenology to observed HarvestStat outcome crosswalk QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jrc-harveststat-crosswalk.yml'
      - 'research/basin-data-audit/scripts/jrc_harveststat_outcome_crosswalk_v1.py'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested dataframe tools
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3'
      - name: Classify real district crop system seasons and compute non-duplicating provisional joins
        run: python research/basin-data-audit/scripts/jrc_harveststat_outcome_crosswalk_v1.py
      - name: Save source-linked QA or failure logs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/season_outcome_crosswalk_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'data QA: classify HarvestStat and JRC calendar linkability without duplicate yields'
            for retry in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harveststat-jrc-season-outcome-crosswalk-v1
          path: research/basin-data-audit/results/season_outcome_crosswalk_v1/
