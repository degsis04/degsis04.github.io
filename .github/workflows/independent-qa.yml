name: Independent QA of HarvestStat and TFDD computations
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/independent-qa.yml'
      - 'research/basin-data-audit/scripts/independent_qa.py'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'geopandas>=1.0,<2' 'pyogrio>=0.9' 'shapely>=2' 'pyproj>=3' 'pycountry' 'requests>=2.31,<3'
      - name: Independent source and geometry QA
        run: python research/basin-data-audit/scripts/independent_qa.py
      - name: Persist QA output even when it fails
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/qa_v1/
          git diff --cached --quiet || (git commit -m 'qa: independent data validation and sensitivity checks' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-replication-qa
          path: research/basin-data-audit/results/qa_v1/
