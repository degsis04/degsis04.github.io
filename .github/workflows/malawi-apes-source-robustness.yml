name: Malawi maize source quality sensitivity and independent regression audit
on:
  push:
    paths:
      - '.github/workflows/malawi-apes-source-robustness.yml'
      - 'research/basin-data-audit/scripts/malawi_source_based_weather_yield_sensitivity.py'
  pull_request:
    paths:
      - '.github/workflows/malawi-apes-source-robustness.yml'
      - 'research/basin-data-audit/scripts/malawi_source_based_weather_yield_sensitivity.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3'
      - name: Evaluate source-audited samples and dense FWL reference
        run: python research/basin-data-audit/scripts/malawi_source_based_weather_yield_sensitivity.py
      - name: Save results and QA failures
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/malawi_apes_fdw_source_audit_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'science QA: historical FDW source-driven weather yield sensitivity'
            for retry in 1 2 3; do git pull --rebase && git push && break || sleep 4; done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Malawi-FDW-source-conditioned-model-QA
          path: research/basin-data-audit/results/malawi_apes_fdw_source_audit_v1/
