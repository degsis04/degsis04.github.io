name: FAO GMIA v5 irrigation source spatial pilot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gmia-pilot.yml'
      - 'research/basin-data-audit/scripts/gmia_irrigation_source_pilot.py'
permissions:
  contents: write
jobs:
  irrigation-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'geopandas>=1.0,<2' 'rasterio>=1.3,<2' 'pyogrio>=0.9' 'shapely>=2' 'pyproj>=3' 'requests>=2.31,<3'
      - name: Validate FAO GMIA maps and raster/BCU calculations
        run: python research/basin-data-audit/scripts/gmia_irrigation_source_pilot.py
      - name: Preserve full source provenance and computed output
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/irrigation_pilot/
          git diff --cached --quiet || (git commit -m 'data: GMIA source-verified irrigation area pilot' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gmia-source-pilot
          path: research/basin-data-audit/results/irrigation_pilot/
