name: CHIRPS v3 monthly 1981-2024 district rainfall panel (4 verified shards)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chirps-monthly-full-panel.yml'
      - 'research/basin-data-audit/scripts/chirps_monthly_admin_panel_v1.py'
permissions:
  contents: write
jobs:
  climate-decade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - start: 1981
            end: 1991
          - start: 1992
            end: 2002
          - start: 2003
            end: 2013
          - start: 2014
            end: 2024
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'geopandas>=1.0,<2' 'rasterio>=1.3,<2' 'pyogrio>=0.9' 'shapely>=2' 'pyproj>=3' 'requests>=2.31,<3'
      - name: Download original CHIRPS monthly final rasters and aggregate to districts
        env:
          START_YEAR: ${{ matrix.start }}
          END_YEAR: ${{ matrix.end }}
        run: python research/basin-data-audit/scripts/chirps_monthly_admin_panel_v1.py
      - name: Preserve shard and source hashes
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/climate_panel/chirps_v3_district_monthly_${{ matrix.start }}_${{ matrix.end }}.csv research/basin-data-audit/results/climate_panel/chirps_provenance_${{ matrix.start }}_${{ matrix.end }}.json || true
          if ! git diff --cached --quiet; then
            git commit -m "climate: CHIRPS district rainfall ${{ matrix.start }}-${{ matrix.end }} verified"
            for retry in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chirps-district-monthly-${{ matrix.start }}-${{ matrix.end }}
          path: |
            research/basin-data-audit/results/climate_panel/chirps_v3_district_monthly_${{ matrix.start }}_${{ matrix.end }}.csv
            research/basin-data-audit/results/climate_panel/chirps_provenance_${{ matrix.start }}_${{ matrix.end }}.json
