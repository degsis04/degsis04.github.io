name: Malawi original APES dashboard historical rows source audit
on:
  push:
    paths:
      - '.github/workflows/malawi-apes-dashboard-source-audit.yml'
      - 'research/basin-data-audit/scripts/malawi_secondary_apes_dashboard_audit_v1.py'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/malawi-apes-dashboard-source-audit.yml'
      - 'research/basin-data-audit/scripts/malawi_secondary_apes_dashboard_audit_v1.py'
permissions:
  contents: write
jobs:
  secondary-apes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Reconstruct public static APES table with original checksum and data caveats
        run: python research/basin-data-audit/scripts/malawi_secondary_apes_dashboard_audit_v1.py
      - name: Preserve secondary source QA and descriptive unharmonized candidate aggregates
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/malawi_apes_fdw_source_audit_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'source audit: preserved independent APES dashboard limitations and maize subtype diagnostic'
            for retry in 1 2 3; do
              git pull --rebase && git push && break || sleep 4
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Malawi-APES-dashboard-source-audit
          path: research/basin-data-audit/results/malawi_apes_fdw_source_audit_v1/
