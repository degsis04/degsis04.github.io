name: HarvestStat Africa x TFDD observed data audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harveststat-audit.yml'
      - 'research/basin-data-audit/scripts/harveststat_audit.py'
permissions:
  contents: write
jobs:
  harveststat-bcu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'geopandas>=1.0,<2' 'pyogrio>=0.9' 'shapely>=2' 'pyproj>=3' 'pycountry' 'requests>=2.31,<3'
      - name: Audit true observations, QC and geographic overlap
        id: audit
        run: python research/basin-data-audit/scripts/harveststat_audit.py
      - name: Commit provenance and summary tables even if audit fails
        if: always()
        run: |
          if [ ! -d research/basin-data-audit/results/harveststat ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/harveststat
          git diff --cached --quiet || (git commit -m 'data: HarvestStat v1.2 x TFDD audit outputs and provenance' && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harveststat-bcu-audit
          path: research/basin-data-audit/results/harveststat/
