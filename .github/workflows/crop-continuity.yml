name: HarvestStat crop continuity and basin shortlisting
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/crop-continuity.yml'
      - 'research/basin-data-audit/scripts/crop_continuity.py'
permissions:
  contents: write
jobs:
  crop-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Analyze actual observed crop/season/country coverage
        run: python research/basin-data-audit/scripts/crop_continuity.py
      - name: Preserve observed summaries and failure provenance
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/crop_continuity/
          git diff --cached --quiet || (git commit -m 'data: season-specific crop continuity and screened basin overlap' && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crop-continuity-audit
          path: research/basin-data-audit/results/crop_continuity/
