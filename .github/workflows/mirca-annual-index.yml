name: MIRCA-OS v2 official annual RAR index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirca-annual-index.yml'
      - 'research/basin-data-audit/scripts/mirca_annual_index.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: sudo apt-get -qq update && sudo apt-get install -y -qq p7zip-full
      - name: Download and inspect source archive with checksums
        run: python research/basin-data-audit/scripts/mirca_annual_index.py
      - name: Commit index and failure log
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/mirca_os/
          git diff --cached --quiet || (git commit -m 'data: exact MIRCA-OS v2 annual map archive inventory' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirca-annual-index
          path: research/basin-data-audit/results/mirca_os/
