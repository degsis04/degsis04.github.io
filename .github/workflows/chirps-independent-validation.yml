name: Independent CHIRPS source raster vs saved panel QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chirps-independent-validation.yml'
      - 'research/basin-data-audit/scripts/chirps_independent_raster_qa_v1.py'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'geopandas>=1.0,<2' 'rasterio>=1.3,<2' 'pyogrio>=0.9' 'shapely>=2' 'pyproj>=3' 'requests>=2.31,<3'
      - name: Independently compare original raster-cell values with saved monthly climate panel
        run: python research/basin-data-audit/scripts/chirps_independent_raster_qa_v1.py
      - name: Preserve validation success or failure log
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/climate_validation/
          git diff --cached --quiet || (git commit -m 'climate QA: independent monthly TIFF pixel cross-check' && git pull --rebase && git push)
