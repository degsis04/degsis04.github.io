name: HarvestStat v1.2 rice descriptive shortfalls - three irrigation case districts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harveststat-rice-shortfalls-v1.yml'
      - 'research/basin-data-audit/scripts/harveststat_rice_production_shortfall_v1.py'
permissions:
  contents: write
jobs:
  harveststat-rice-losses:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compute rice descriptive yield losses on byte-verified HarvestStat v1.2
        run: python research/basin-data-audit/scripts/harveststat_rice_production_shortfall_v1.py
      - name: Commit reproducible outputs on successful QA
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/rice_loss_v1/
          git diff --cached --quiet || (git commit -m 'data: QC-verified three-case rice shortfall series' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-irrigation-case-rice-shortfall-audit
          path: research/basin-data-audit/results/rice_loss_v1/
