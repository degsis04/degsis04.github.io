name: Independent NumPy FWL cross-check of Malawi rainfed maize yield models
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/malawi-rainfed-maize-FWL-independent-QA.yml'
      - 'research/basin-data-audit/scripts/malawi_rainfed_maize_independent_FWL_QA.py'
      - 'research/basin-data-audit/results/malawi_rainfed_weather_yield_v1/malawi_rainfed_maize_exploratory_model_QA.json'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: python research/basin-data-audit/scripts/malawi_rainfed_maize_independent_FWL_QA.py
      - name: Preserve independent coefficient and cluster uncertainty verification
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/malawi_rainfed_weather_yield_v1/malawi_rainfed_maize_INDEPENDENT_FWL_model_QA.json
          if ! git diff --cached --quiet; then
            git commit -m 'QA: independently validate Malawi rainfed maize FE coefficients and district-year cluster SE'
            for attempt in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
