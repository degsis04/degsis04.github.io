name: Malawi maize independent crop-calendar rainfall sensitivity test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/malawi-maize-window-sensitivity.yml'
      - 'research/basin-data-audit/scripts/malawi_maize_calendar_window_sensitivity_v1.py'
permissions:
  contents: write
jobs:
  maize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3'
      - run: python research/basin-data-audit/scripts/malawi_maize_calendar_window_sensitivity_v1.py
      - name: Commit source-level QA diagnostics even on failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/malawi_maize_calendar_sensitivity_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'science QA: 4 seasonal climate windows Malawi maize 1981-2024'
            for attempt in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
