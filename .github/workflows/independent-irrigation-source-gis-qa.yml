name: Independently recheck Niger Volta scheme GIS and crop evidence gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/independent-irrigation-source-gis-qa.yml'
      - 'research/basin-data-audit/scripts/independent_irrigation_evidence_gate_QA.py'
      - 'research/basin-data-audit/results/water_source_gate_v1/intake_scheme_spatial_evidence_gate_QA.json'
permissions:
  contents: write
jobs:
  secondary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'geopandas>=1.0,<2' 'shapely>=2' 'pyogrio>=0.9' 'pyproj>=3' 'requests>=2.31,<3'
      - run: python research/basin-data-audit/scripts/independent_irrigation_evidence_gate_QA.py
      - name: Preserve second geographic method and source status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/water_source_gate_v1/independent_water_source_site_geometry_and_outcome_QA.json
          if ! git diff --cached --quiet; then
            git commit -m 'double QA: independent geographical site containment and original crop-series and MIRCA verification'
            for retry in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
