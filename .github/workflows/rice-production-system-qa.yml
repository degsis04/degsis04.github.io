name: QA irrigated versus mixed-system rice outcome series
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rice-production-system-qa.yml'
      - 'research/basin-data-audit/scripts/rice_production_system_qa.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2,<3'
      - run: python research/basin-data-audit/scripts/rice_production_system_qa.py
      - name: Save exact source-matched subtype screen
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/rice_feasibility/
          git diff --cached --quiet || (git commit -m 'qa: rice production-system alignment audit' && git pull --rebase && git push)
