name: Verify Niger Volta irrigation site geography and hard hydrologic evidence gates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/irrigation-intake-evidence-gate.yml'
      - 'research/basin-data-audit/scripts/irrigation_intake_evidence_gate_v1.py'
permissions:
  contents: write
jobs:
  evidence-gis:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial IO and geometry
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'geopandas>=1.0,<2' 'shapely>=2' 'pyogrio>=0.9' 'pyproj>=3' 'requests>=2.31,<3'
      - name: Verify actual source-boundary SHA and 3 candidate evidence gates
        run: python research/basin-data-audit/scripts/irrigation_intake_evidence_gate_v1.py
      - name: Preserve evidence or exact blocker and all geo provenance
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/water_source_gate_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'science QA: exact GIS association of three documentary schemes with original HarvestStat units and water source evidence grades'
            for retry in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irrigation-source-evidence-gate-three-candidates
          path: research/basin-data-audit/results/water_source_gate_v1/
