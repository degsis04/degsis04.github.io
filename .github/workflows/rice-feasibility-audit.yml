name: Actual HarvestStat rice continuity x MIRCA-OS district exposure
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rice-feasibility-audit.yml'
      - 'research/basin-data-audit/scripts/rice_feasibility_audit.py'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'geopandas>=1.0,<2' 'pyogrio>=0.9' 'shapely>=2' 'pyproj>=3' 'requests>=2.31,<3'
      - name: Evaluate real rice crop years and matched district exposure
        run: python research/basin-data-audit/scripts/rice_feasibility_audit.py
      - name: Preserve provenance on success or failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/rice_feasibility/
          git diff --cached --quiet || (git commit -m 'qa: actual rice district time series x irrigation exposure' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rice-feasibility-source-QA
          path: research/basin-data-audit/results/rice_feasibility/
