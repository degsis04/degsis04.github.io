name: Malawi APES/FDW canonical raw source discovery
on:
  push:
    paths:
      - '.github/workflows/malawi-apes-fdw-discovery.yml'
      - 'research/basin-data-audit/scripts/malawi_apes_fdw_discovery_v1.py'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/malawi-apes-fdw-discovery.yml'
      - 'research/basin-data-audit/scripts/malawi_apes_fdw_discovery_v1.py'
permissions:
  contents: write
jobs:
  discover-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Verify canonical raw FDW ZIP and inspect APES static data
        run: python research/basin-data-audit/scripts/malawi_apes_fdw_discovery_v1.py
      - name: Preserve audit including errors without raw redistributed data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/malawi_apes_fdw_source_audit_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'source audit: canonical MW FDW and APES discovery'
            for retry in 1 2 3; do
              git pull --rebase && git push && break || sleep 4
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MW-APES-FDW-discovery-QA
          path: research/basin-data-audit/results/malawi_apes_fdw_source_audit_v1/
