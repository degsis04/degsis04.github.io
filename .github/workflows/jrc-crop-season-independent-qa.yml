name: Independently verify seasonal crop weather including cross-year dates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jrc-crop-season-independent-qa.yml'
      - 'research/basin-data-audit/scripts/jrc_crop_season_CHIRPS_independent_qa.py'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3'
      - run: python research/basin-data-audit/scripts/jrc_crop_season_CHIRPS_independent_qa.py
      - name: Preserve numerical QA
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/seasonal_climate_v1/seasonal_climate_independent_QA.json
          git diff --cached --quiet || (git commit -m 'QA: cross-year month series climate sum and climatology double-check' && git pull --rebase && git push)
