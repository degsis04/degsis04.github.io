name: Independent source crop-calendar and season QA v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/crop-calendar-outcome-qa-v2.yml'
      - 'research/basin-data-audit/scripts/crop_calendar_outcome_qa_v2.py'
permissions:
  contents: write
jobs:
  time-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Re-audit real metadata and country overlap
        run: python research/basin-data-audit/scripts/crop_calendar_outcome_qa_v2.py
      - name: Preserve results and provenance including failures
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/calendar_qa_v1/
          git diff --cached --quiet || (git commit -m 'qa: crop calendar source metadata independent audit' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crop-calendar-metadata-qa
          path: research/basin-data-audit/results/calendar_qa_v1/
