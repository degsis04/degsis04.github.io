name: Documented institution events x observed crop years
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/institution-temporal-screen.yml'
      - 'research/basin-data-audit/scripts/institution_temporal_screen.py'
      - 'research/basin-data-audit/institutions/verified_document_events_v1.csv'
permissions:
  contents: write
jobs:
  institution-event-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2,<3'
      - run: python research/basin-data-audit/scripts/institution_temporal_screen.py
      - name: Commit results and explicit failure log
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/crop_continuity/
          git diff --cached --quiet || (git commit -m 'data: documentary event x crop pre/post coverage' && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institution-temporal-screen
          path: research/basin-data-audit/results/crop_continuity/
