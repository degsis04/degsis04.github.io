name: Stage31 Sourou full rice decomposition and DGRE year-boundary QA
on:
  push:
    paths:
      - 'research/basin-data-audit/scripts/stage31_sourou_interannual_and_dgre_reconcile.py'
      - '.github/workflows/stage31-sourou-interannual-DGRE-QA.yml'
  pull_request:
    paths:
      - 'research/basin-data-audit/scripts/stage31_sourou_interannual_and_dgre_reconcile.py'
      - '.github/workflows/stage31-sourou-interannual-DGRE-QA.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage31:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/basin-data-audit/scripts/stage31_sourou_interannual_and_dgre_reconcile.py
      - name: Persist derived calculations plus explicit caveat QA
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/stage31_sourou_reconciliation/
          if ! git diff --cached --quiet; then
            git commit -m 'stage31 source-checked rice yield/area decomposition and Yaran reservoir chronology conflicts'
            for retry in 1 2 3 4; do git pull --rebase && git push && break || sleep 5; done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage31-sourou-physical-and-yield-QA
          path: research/basin-data-audit/results/stage31_sourou_reconciliation/
