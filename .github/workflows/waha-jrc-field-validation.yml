name: Compare field-reported Waha seasons with independent JRC reference calendars
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/waha-jrc-field-validation.yml'
      - 'research/basin-data-audit/scripts/waha_jrc_region_month_agreement_v1.py'
      - 'research/basin-data-audit/results/field_phenology_v1/waha_field_source_qa.json'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3'
      - name: Recompute source-month comparison for Mali and Malawi administrative regions
        run: python research/basin-data-audit/scripts/waha_jrc_region_month_agreement_v1.py
      - name: Save result or explicit failure explanation
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/field_phenology_v1/waha_vs_jrc_Mali_Malawi_admin1_month_agreement.csv
          git add research/basin-data-audit/results/field_phenology_v1/waha_jrc_region_agreement_QA.json
          if ! git diff --cached --quiet; then
            git commit -m 'QA: Waha field observed vs JRC reference crop calendar region agreement'
            for attempt in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
