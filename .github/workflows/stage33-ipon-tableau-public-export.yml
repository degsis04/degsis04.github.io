name: Stage33 IPON Tableau public zone and ground-water source export audit
on:
  push:
    paths:
      - 'research/basin-data-audit/scripts/stage33_ipon_public_tableau_export_gate.py'
      - '.github/workflows/stage33-ipon-tableau-public-export.yml'
  pull_request:
    paths:
      - 'research/basin-data-audit/scripts/stage33_ipon_public_tableau_export_gate.py'
      - '.github/workflows/stage33-ipon-tableau-public-export.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3'
      - name: Check legitimate public Tableau exports and verify available source tables
        run: python research/basin-data-audit/scripts/stage33_ipon_public_tableau_export_gate.py
      - name: Persist public-source inventory even when exports inaccessible
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/stage33_ipon_public_access/
          if ! git diff --cached --quiet; then
            git commit -m 'stage33 IPON public Tableau export verification and no-data evidence'
            for retry in 1 2 3 4; do git pull --rebase && git push && break || sleep 5; done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage33-IPON-public-export-QA
          path: research/basin-data-audit/results/stage33_ipon_public_access/
