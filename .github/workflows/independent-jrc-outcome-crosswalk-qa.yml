name: Independent validation of provisional HarvestStat-JRC-CHIRPS joins
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/independent-jrc-outcome-crosswalk-qa.yml'
      - 'research/basin-data-audit/scripts/independent_jrc_outcome_crosswalk_qa.py'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3'
      - run: python research/basin-data-audit/scripts/independent_jrc_outcome_crosswalk_qa.py
      - name: Save independent verification or exception details
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/season_outcome_crosswalk_v1/independent_crosswalk_quality_checks.json
          git diff --cached --quiet || (git commit -m 'QA: independent verification of crop-weather-outcome crosswalk' && git pull --rebase && git push)
