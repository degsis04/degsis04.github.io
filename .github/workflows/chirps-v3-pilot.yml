name: CHIRPS v3 official monthly raster pilot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chirps-v3-pilot.yml'
      - 'research/basin-data-audit/scripts/chirps_v3_pilot.py'
permissions:
  contents: write
jobs:
  chirps-source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'geopandas>=1.0,<2' 'pyogrio>=0.9' 'shapely>=2' 'pyproj>=3' 'rasterio>=1.3,<2' 'requests>=2.31,<3'
      - name: Download four official CHIRPS v3 monthly rasters and validate spatial units
        run: python research/basin-data-audit/scripts/chirps_v3_pilot.py
      - name: Save provenance including failure status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/hydromet_pilot/
          git diff --cached --quiet || (git commit -m 'hydromet: source validated CHIRPS v3 monthly pilot' && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chirps-v3-bcu-monthly-pilot
          path: research/basin-data-audit/results/hydromet_pilot/
