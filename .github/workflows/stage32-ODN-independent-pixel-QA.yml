name: Stage32 independent FAO ODN pixelwise 2022-2023 raster verification
on:
  push:
    paths:
      - '.github/workflows/stage32-ODN-independent-pixel-QA.yml'
      - 'research/basin-data-audit/scripts/stage32_wapor_ODN_independent_paired_QA.py'
  pull_request:
    paths:
      - '.github/workflows/stage32-ODN-independent-pixel-QA.yml'
      - 'research/basin-data-audit/scripts/stage32_wapor_ODN_independent_paired_QA.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=1.26,<3' 'rasterio>=1.3,<2' 'requests>=2.31,<3'
      - run: python research/basin-data-audit/scripts/stage32_wapor_ODN_independent_paired_QA.py
      - name: Persist original source-checked pixel change analysis
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/basin-data-audit/results/stage32_wapor_odon_real_rasters/
          if ! git diff --cached --quiet; then
            git commit -m 'stage32 independent WaPOR original 2022-23 pixel change QA'
            for try in 1 2 3 4; do git pull --rebase && git push && break || sleep 5; done
          fi
